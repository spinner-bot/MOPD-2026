<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>PT.2 · Prune-OPD & Flow-OPD 论文精讲</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.min.css">

<style>
:root{--bg:#030206;--surface:rgba(15,15,35,0.75);--border:rgba(120,100,180,0.12);--text:#e0dce8;--text2:rgba(210,200,230,0.65);--text3:rgba(160,145,190,0.4);--prune:#34d399;--flow:#a78bfa;--gold:#fbbf24;--rose:#fb7185;--accent-g:#22d3a0}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}.reveal{background:transparent}.reveal .slides{text-align:center;width:100%!important;left:50%!important;margin:0!important}.reveal .slides section{padding:28px 48px;height:100%;display:flex!important;flex-direction:column;align-items:center;justify-content:center}.reveal .controls{right:12px!important;bottom:12px!important}#page-indicator{position:fixed;left:24px;bottom:20px;z-index:100;font-size:13px;color:rgba(255,255,255,0.3);font-family:'JetBrains Mono','Fira Code','Consolas',monospace;letter-spacing:1px;pointer-events:none}
.star-card{position:relative;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px 48px;max-width:880px;box-shadow:0 8px 40px rgba(0,0,0,0.7),0 0 80px rgba(52,211,153,0.04)}.star-card::before{content:'';height:2px;background:linear-gradient(90deg,transparent,var(--prune),var(--flow),var(--gold),transparent);display:block;margin-bottom:12px}
.hero-title{font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--prune) 0%,var(--flow) 50%,var(--gold) 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gS 5s ease infinite}@keyframes gS{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.star-bar{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--prune),var(--flow),var(--gold),transparent);margin:14px auto}
.page-badge{display:inline-flex;padding:4px 14px;border-radius:14px;font-size:10px;font-weight:700;background:rgba(52,211,153,0.08);color:var(--prune);border:1px solid rgba(52,211,153,0.2);letter-spacing:1px}
.page-badge-r{display:inline-flex;padding:4px 14px;border-radius:14px;font-size:10px;font-weight:700;background:rgba(167,139,250,0.08);color:var(--flow);border:1px solid rgba(167,139,250,0.2);letter-spacing:1px}
.page-badge-g{display:inline-flex;padding:4px 14px;border-radius:14px;font-size:10px;font-weight:700;background:rgba(34,211,160,0.08);color:var(--accent-g);border:1px solid rgba(34,211,160,0.2);letter-spacing:1px}

/* ── 论文左右讲解布局 ── */
.paper-split{display:flex;gap:24px;max-width:1120px;width:100%;align-items:stretch}.paper-left{flex:1;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:22px 24px;text-align:left;overflow-y:auto;max-height:530px;font-size:12.5px;line-height:2;color:rgba(220,225,240,0.85)}.paper-left .hl-g{border-bottom:2px solid var(--gold);background:rgba(251,191,36,0.1);padding:0 3px;font-weight:600;color:#fff}.paper-left .hl-b{border-bottom:2px solid var(--prune);background:rgba(52,211,153,0.1);padding:0 3px;font-weight:600;color:#fff}.paper-left .hl-r{border-bottom:2px solid var(--flow);background:rgba(167,139,250,0.1);padding:0 3px;font-weight:600;color:#fff}
.paper-right{flex:1;background:rgba(52,211,153,0.03);border:1px solid rgba(52,211,153,0.15);border-radius:10px;padding:22px 24px;text-align:left;overflow-y:auto;max-height:530px}.paper-right .section-label{font-size:10px;font-weight:700;color:var(--prune);letter-spacing:2px;margin-bottom:8px;text-transform:uppercase}.paper-right .comment{font-size:12.5px;color:var(--text);line-height:1.9;border-left:2px solid var(--prune);padding-left:14px;margin:8px 0}.paper-right .insight{font-size:12px;color:var(--gold);line-height:1.8;background:rgba(251,191,36,0.06);border-radius:8px;padding:10px 14px;margin:8px 0}.paper-right .warn{font-size:12px;color:var(--rose);line-height:1.8;border-left:2px solid var(--rose);padding-left:14px;margin:8px 0}
.paper-right.flow-theme{background:rgba(167,139,250,0.03);border:1px solid rgba(167,139,250,0.15)}.paper-right.flow-theme .section-label{color:var(--flow)}.paper-right.flow-theme .comment{border-left-color:var(--flow)}

/* ── 通用组件 ── */
.two-col{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:960px}.two-col>div{flex:1;min-width:260px}.tri-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:960px}
.concept-block{background:rgba(20,20,40,0.5);border:1px solid var(--border);border-radius:10px;padding:16px 14px;text-align:left}.concept-block h4{font-size:13px;color:var(--prune);margin:0 0 5px}.concept-block p{font-size:11px;color:var(--text2);line-height:1.7;margin:0}
.concept-block.r h4{color:var(--flow)}.concept-block.g h4{color:var(--accent-g)}
.formula-box{background:rgba(6,4,18,0.85);border:1px solid rgba(52,211,153,0.15);border-radius:10px;padding:18px 24px;max-width:800px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.5);margin:8px 0}.formula-box .math-block{font-size:16px;color:#d4c8b0}
.def-box{background:rgba(52,211,153,0.04);border:1px solid rgba(52,211,153,0.15);border-left:3px solid var(--prune);border-radius:0 10px 10px 0;padding:14px 20px;text-align:left;max-width:780px;margin:8px 0}.def-box .label{font-size:11px;color:var(--prune);font-weight:700;margin-bottom:4px}.def-box .content{font-size:12px;color:var(--text);line-height:1.8}
.def-box.r{background:rgba(167,139,250,0.04);border-color:rgba(167,139,250,0.15);border-left-color:var(--flow)}.def-box.r .label{color:var(--flow)}
.warn-box{background:rgba(251,113,133,0.05);border:1px solid rgba(251,113,133,0.15);border-left:3px solid var(--rose);border-radius:0 10px 10px 0;padding:14px 20px;text-align:left;max-width:780px;margin:8px 0}.warn-box .label{font-size:11px;color:var(--rose);font-weight:700;margin-bottom:4px}.warn-box .content{font-size:12px;color:var(--text);line-height:1.8}
.summary-table{width:100%;max-width:860px;border-collapse:collapse;font-size:11px;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.5)}.summary-table thead{background:linear-gradient(135deg,rgba(52,211,153,0.18),rgba(167,139,250,0.1))}.summary-table th{padding:10px 12px;font-weight:700;color:var(--gold);font-size:10px}.summary-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2)}.summary-table tbody tr{background:rgba(20,20,40,0.4)}.summary-table .pc{font-weight:700;color:var(--gold)}.summary-table .hl{color:var(--prune);font-weight:600}.summary-table .wr{color:var(--flow);font-weight:600}
.struct-head{font-size:18px;font-weight:700;color:var(--prune);margin:0 0 8px;border-bottom:1px solid rgba(52,211,153,0.25);display:inline-block;padding-bottom:4px}.struct-content{font-size:13px;color:var(--text2);line-height:2;text-align:left;max-width:800px}.struct-content strong{color:#fff}
.cite{font-size:10px;color:var(--prune);font-family:monospace}
.tag-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}.tag{padding:4px 12px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:1px}.tag-b{background:rgba(52,211,153,0.1);color:var(--prune);border:1px solid rgba(52,211,153,0.2)}.tag-r{background:rgba(167,139,250,0.1);color:var(--flow);border:1px solid rgba(167,139,250,0.2)}.tag-g{background:rgba(34,211,160,0.1);color:var(--accent-g);border:1px solid rgba(34,211,160,0.2)}
.flow-diagram{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:10px 0}.flow-node{padding:12px 24px;border-radius:10px;font-size:13px;font-weight:700}.fn-b{background:rgba(52,211,153,0.1);border:2px solid rgba(52,211,153,0.35);color:var(--prune)}.fn-r{background:rgba(167,139,250,0.1);border:2px solid rgba(167,139,250,0.35);color:var(--flow)}.fn-g{background:rgba(34,211,160,0.1);border:2px solid rgba(34,211,160,0.35);color:var(--accent-g)}.flow-arrow{font-size:20px;color:var(--text3)}
.step-num{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--prune);color:#030206;margin-right:8px;flex-shrink:0}
.reveal .slides section .fragment.fade-up{opacity:0;transform:translateY(30px);transition:all 0.7s}.reveal .slides section .fragment.fade-up.visible{opacity:1;transform:translateY(0)}
@media(max-width:768px){.hero-title{font-size:28px}.tri-grid{grid-template-columns:1fr}.two-col{flex-direction:column}.paper-split{flex-direction:column}}
</style></head><body><canvas id="bg-canvas"></canvas><div id="page-indicator"></div><div class="reveal"><div class="slides">

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Module 2 · 多模态发展历程 2020–2026</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.min.css"><script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]}};</script><style>:root{--bg:#030206;--surface:rgba(20,18,30,0.7);--border:rgba(120,100,180,0.15);--text:#e0dce8;--text2:rgba(210,200,230,0.7);--text3:rgba(160,145,190,0.45);--vlm:#b794f4;--vis:#60a5fa;--aud:#4ade80;--vid:#facc15;--gen:#fb7185}#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}.reveal{background:transparent}.reveal .slides{text-align:center;width:100%!important;left:50%!important;margin:0!important}.reveal .slides section{padding:28px 48px;display:flex!important;flex-direction:column;align-items:center;justify-content:center}.reveal .controls{right:12px!important;bottom:12px!important}#page-indicator{position:fixed;left:24px;bottom:20px;z-index:100;font-size:13px;color:rgba(180,160,210,0.4);font-family:'JetBrains Mono',monospace;pointer-events:none}.ac-card{z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 46px;max-width:860px;box-shadow:0 8px 32px rgba(0,0,0,0.6)}.glass-card{position:relative;z-index:2;background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:40px 50px;max-width:860px;box-shadow:0 16px 48px rgba(0,0,0,0.6)}.glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--vis),var(--aud),var(--vid),transparent)}.hero-title{font-size:46px;font-weight:800;background:linear-gradient(135deg,var(--vlm),var(--vis),var(--aud),var(--vid),var(--gen));background-size:300%300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shift 6s ease infinite}@keyframes shift{0%,100%{background-position:0%50%}25%{background-position:100%0%}50%{background-position:100%100%}75%{background-position:0%100%}}.ac-bar{width:100px;height:2px;background:linear-gradient(90deg,transparent,var(--vlm),var(--vis),var(--aud),var(--vid),transparent);margin:14px auto}.glow-bar{width:100px;height:2px;background:linear-gradient(90deg,transparent,var(--vid),var(--aud),transparent);margin:16px auto;animation:gP 2s ease-in-out infinite}@keyframes gP{0%,100%{opacity:0.4;width:100px}50%{opacity:1;width:160px}}.struct-content{font-size:13px;color:var(--text2);line-height:2;text-align:left;max-width:780px}.struct-content strong{color:#fff}.two-col{display:flex;gap:20px;flex-wrap:wrap;max-width:940px}.two-col>div{flex:1;min-width:260px}.tri-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:940px}.concept-block{background:rgba(20,18,30,0.5);border:1px solid var(--border);border-radius:10px;padding:14px 12px;text-align:left;margin-bottom:6px}.concept-block h4{font-size:12px;color:var(--vlm);margin:0 0 4px}.concept-block p{font-size:10px;color:var(--text2);line-height:1.6;margin:0}.concept-card{background:rgba(20,18,30,0.6);border:1px solid var(--border);border-radius:14px;padding:20px 18px;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,0.4);transition:all 0.3s}.concept-card:hover{transform:translateY(-3px);border-color:rgba(180,160,210,0.3)}.concept-card h4{font-size:14px;color:var(--vlm);margin:0 0 6px}.concept-card p{font-size:11px;color:var(--text2);line-height:1.7;margin:0}.paper-card{background:linear-gradient(135deg,rgba(30,20,50,0.6),rgba(20,15,35,0.8));border:1px solid var(--border);border-radius:10px;padding:20px 22px;text-align:left;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,0.4);max-width:780px}.formula-box{background:rgba(8,6,15,0.8);border:1px solid rgba(120,100,180,0.2);border-radius:10px;padding:18px 24px;max-width:780px;text-align:center;margin:8px 0}.formula-box .math-block{font-size:15px;color:#d4c8b0}.def-box{background:rgba(120,100,180,0.06);border:1px solid rgba(120,100,180,0.2);border-left:3px solid var(--vlm);border-radius:0 10px 10px 0;padding:14px 20px;text-align:left;max-width:750px;margin:8px 0}.def-box .label{font-size:11px;color:var(--vlm);font-weight:700;margin-bottom:4px}.def-box .content{font-size:12px;color:var(--text);line-height:1.8}.summary-table{width:100%;max-width:820px;border-collapse:collapse;font-size:11px;border-radius:10px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,0.5)}.summary-table thead{background:linear-gradient(135deg,rgba(183,148,244,0.2),rgba(96,165,250,0.1))}.summary-table th{padding:9px 12px;font-weight:700;color:#fff;font-size:10px}.summary-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text2)}.summary-table tbody tr{background:rgba(20,18,30,0.4)}.summary-table .pc{font-weight:700;color:#fff}.summary-table .hl{color:var(--vid);font-weight:600}.flow-diagram{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;padding:16px}.flow-node{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;text-align:center;min-width:100px;font-size:12px;font-weight:600;color:var(--text2)}.flow-node.accent{border-color:rgba(96,165,250,0.4);color:var(--vis);background:rgba(96,165,250,0.08)}.flow-arrow{font-size:18px;color:rgba(255,255,255,0.3)}.page-badge{display:inline-flex;padding:4px 14px;border-radius:14px;font-size:10px;font-weight:700;background:rgba(183,148,244,0.08);color:var(--vlm);border:1px solid rgba(183,148,244,0.2);letter-spacing:1px}.cite{font-size:10px;color:var(--vlm);font-family:monospace}.tag-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}.tag{padding:6px 18px;border-radius:16px;font-size:11px;font-weight:600;border:1px solid;letter-spacing:1px;opacity:0;animation:tP 0.6s cubic-bezier(.34,1.56,.64,1) forwards}.tag:nth-child(1){animation-delay:.3s;border-color:var(--vid);color:var(--vid)}.tag:nth-child(2){animation-delay:.5s;border-color:var(--aud);color:var(--aud)}.tag:nth-child(3){animation-delay:.7s;border-color:var(--gen);color:var(--gen)}@keyframes tP{from{opacity:0;transform:scale(.7)translateY(10px)}to{opacity:1;transform:scale(1)translateY(0)}}.dag-scroll{width:100%;text-align:center}.dag-scroll svg{max-width:100%;height:auto}.dag-hl{width:100%;overflow:hidden;position:relative}.dag-hl svg{transition:transform 0.6s ease}.reveal .slides section .fragment.fade-up{opacity:0;transform:translateY(30px);transition:all 0.7s}.reveal .slides section .fragment.fade-up.visible{opacity:1;transform:translateY(0)}@media(max-width:768px){.hero-title{font-size:28px}.tri-grid{grid-template-columns:1fr}.two-col{flex-direction:column}.glass-card{padding:24px 20px}}</style></head><body><canvas id="bg-canvas"></canvas><div id="page-indicator"></div><div class="reveal"><div class="slides">

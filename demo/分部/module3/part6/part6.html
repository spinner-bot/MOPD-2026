<style>

.summary-table{width:100%;max-width:820px;border-collapse:collapse;font-size:10.5px;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.5)}.summary-table thead{background:linear-gradient(135deg,rgba(124,92,231,0.25),rgba(225,112,85,0.12))}.summary-table th{padding:9px 12px;font-weight:700;color:var(--beam);font-size:10px}.summary-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text2)}.summary-table tbody tr{background:rgba(20,18,30,0.4)}.summary-table .pc{font-weight:700;color:var(--beam)}.summary-table .hl{color:var(--nova);font-weight:600}.summary-table .wd{color:var(--flare);font-weight:600}
.page-badge{display:inline-flex;padding:4px 14px;border-radius:14px;font-size:10px;font-weight:700;background:rgba(253,203,110,0.1);color:var(--beam);border:1px solid rgba(253,203,110,0.2);letter-spacing:1px}.cite{font-size:10px;color:var(--beam);font-family:monospace}
.step-flow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:940px;margin:8px 0}.step{background:rgba(20,18,30,0.5);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;min-width:100px;flex:1}.step .sn{font-size:9px;color:var(--beam);font-weight:700;margin-bottom:3px}.step .st{font-size:11px;color:#fff;font-weight:600}.step .sd{font-size:9px;color:var(--text2);line-height:1.5}.step-arrow{color:var(--text3);font-size:16px;font-weight:700}
.reveal .slides section .fragment.fade-up{opacity:0;transform:translateY(30px);transition:all 0.7s}.reveal .slides section .fragment.fade-up.visible{opacity:1;transform:translateY(0)}
@media(max-width:768px){.hero-title{font-size:28px}.two-col{flex-direction:column}.step-flow{flex-direction:column}.step-arrow{transform:rotate(90deg)}}
</style></head><body><canvas id="bg-canvas"></canvas><div id="page-indicator"></div><div class="reveal"><div class="slides">

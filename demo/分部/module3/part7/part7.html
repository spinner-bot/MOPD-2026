<style>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>(function(){/* 扩散去噪粒子场：噪声 ⇄ 结构（黄金角螺旋）的循环相变 —— 隐喻扩散模型从噪声生成结构 */
const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');let W,H;function rs(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}window.addEventListener('resize',rs);rs();
const N=560,GA=Math.PI*(3-Math.sqrt(5));const fr=x=>x-Math.floor(x);const pts=[];
for(let i=0;i<N;i++){pts.push({nx:fr(Math.sin(i*12.9898)*43758.5453),ny:fr(Math.sin(i*78.233)*12543.123),ph:fr(Math.sin(i*39.425)*7919.77)*Math.PI*2,hue:(i/N)*300})}
let frame=0;function lp(){ctx.clearRect(0,0,W,H);const t=frame*0.016,R=Math.min(W,H)*0.44,CX=W/2,CY=H/2;
for(let i=0;i<N;i++){const p=pts[i];
const nx=p.nx*W+Math.sin(t*0.30+p.ph)*46,ny=p.ny*H+Math.cos(t*0.26+p.ph*1.7)*46;/* 噪声态：缓慢漂移 */
const rr=Math.sqrt((i+0.5)/N)*R,a=i*GA+t*0.06,tx=CX+rr*Math.cos(a),ty=CY+rr*Math.sin(a);/* 结构态：黄金角螺旋 */
const k=(Math.sin(t*0.33-rr*0.0042)+1)/2,e=k*k*(3-2*k);/* 去噪因子：由内向外扫过 */
const x=nx+(tx-nx)*e,y=ny+(ty-ny)*e,alpha=0.09+0.26*e,sz=1.0+1.7*(1-rr/R)*e,hue=(p.hue+t*12)%360;
ctx.beginPath();ctx.arc(x,y,sz,0,7);ctx.fillStyle='hsla('+hue+',92%,60%,'+alpha+')';ctx.fill()}
frame++;requestAnimationFrame(lp)}lp()})();</script>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Module 2 风格测试 — 多模态流形光带</title>
<style>
/* ═══════════ Module 2: 多模态融合主题 ═══════════
   风格定位：流形光带 · 模态融合 · 深空渐变
   与 Module 1 (粒子网络) 和 Module 1+ (网格几何) 形成三重奏
   ═══════════════════════════════════════════════ */
:root{
  --bg:#06050a;
  --surface:rgba(20,18,30,0.7);
  --border:rgba(120,100,180,0.15);
  --text:#e0dce8;
  --text2:rgba(210,200,230,0.7);
  --text3:rgba(160,145,190,0.45);
  /* 多模态色谱 */
  --vlm:#a78bfa;     /* 视觉语言 - 紫 */
  --vis:#38bdf8;     /* 视觉 - 蓝 */
  --aud:#34d399;     /* 音频 - 绿 */
  --vid:#fbbf24;     /* 视频 - 金 */
  --gen:#f472b6;     /* 生成 - 粉 */
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}

#bg-canvas{position:fixed;inset:0;z-index:0}

.content{position:relative;z-index:2;text-align:center;max-width:800px;padding:40px}
h1{font-size:48px;font-weight:800;margin-bottom:16px;
  background:linear-gradient(135deg,var(--vlm),var(--vis),var(--aud),var(--vid),var(--gen));
  background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shift 6s ease infinite;}
@keyframes shift{0%,100%{background-position:0% 50%}25%{background-position:100% 0%}50%{background-position:100% 100%}75%{background-position:0% 100%}}
.subtitle{font-size:18px;color:var(--text2);margin-bottom:8px}
.bar{width:120px;height:2px;margin:20px auto;background:linear-gradient(90deg,transparent,var(--vlm),var(--vis),var(--aud),var(--vid),transparent);border-radius:1px}

.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;min-width:120px;text-align:center;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.card:nth-child(1)::before{background:var(--vlm)}.card:nth-child(2)::before{background:var(--vis)}
.card:nth-child(3)::before{background:var(--aud)}.card:nth-child(4)::before{background:var(--vid)}
.card:nth-child(5)::before{background:var(--gen)}
.card .icon{font-size:32px;margin-bottom:8px}
.card .label{font-size:13px;font-weight:600;color:var(--text2)}

.footer{font-size:12px;color:var(--text3);margin-top:24px}
</style></head><body>
<canvas id="bg-canvas"></canvas>
<div class="content">
  <p style="font-size:13px;color:var(--vlm);letter-spacing:4px;">MODULE 2 PREVIEW</p>
  <h1>多模态模型<br>发展历程</h1>
  <p class="subtitle">Vision · Language · Audio · Video · Generation</p>
  <div class="bar"></div>
  <p style="font-size:14px;color:var(--text2);margin-top:8px;">2020 ViT → 2026 Any-to-Any 世界模型</p>
  <div class="cards">
    <div class="card"><div class="icon">👁️</div><div class="label">Vision</div></div>
    <div class="card"><div class="icon">📝</div><div class="label">Language</div></div>
    <div class="card"><div class="icon">🎵</div><div class="label">Audio</div></div>
    <div class="card"><div class="icon">🎬</div><div class="label">Video</div></div>
    <div class="card"><div class="icon">🎨</div><div class="label">Generate</div></div>
  </div>
  <p class="footer">流形光带背景 · 多模态色谱 · 深空暗色基底</p>
</div>

<script>
// ═══════════ 流形光带背景引擎 v2 (炫酷增强) ═══════════
(function(){
const c=document.getElementById("bg-canvas"),x=c.getContext("2d");
let W,H,ribbons=[],sparks=[],frame=0;

function rs(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener("resize",rs);rs();

// 光带类 v2：更宽、更亮、色彩更丰富
class Ribbon{
  constructor(){
    this.reset();
  }
  reset(){
    this.points=[];
    this.y=Math.random()*H;
    this.speed=(Math.random()-0.5)*0.4;
    this.width=Math.random()*120+60;
    this.alpha=Math.random()*0.07+0.04;
    const colors=[
      'rgba(167,139,250,','rgba(56,189,248,','rgba(52,211,153,',
      'rgba(251,191,36,','rgba(244,114,182,','rgba(129,140,248,',
      'rgba(94,234,212,','rgba(253,164,175,'
    ];
    this.color=colors[Math.floor(Math.random()*8)];
    for(let i=0;i<=24;i++){
      this.points.push({x:i*W/24,y:Math.random()*80-40});
    }
  }
  update(){
    this.y+=this.speed;
    if(this.y<-150||this.y>H+150)this.reset();
    for(let p of this.points){
      p.y+=(Math.random()-0.5)*0.7;
    }
  }
  draw(ctx){
    ctx.save();
    ctx.globalAlpha=this.alpha;
    // 外层辉光
    ctx.shadowColor=this.color+'0.4)';
    ctx.shadowBlur=30;
    ctx.beginPath();
    ctx.moveTo(0,this.y);
    for(let i=0;i<this.points.length;i++){
      const px=this.points[i].x,py=this.y+this.points[i].y;
      if(i<this.points.length-1){
        const nx=this.points[i+1].x,ny=this.y+this.points[i+1].y;
        ctx.quadraticCurveTo(px,py,(px+nx)/2,(py+ny)/2);
      }
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    ctx.fillStyle=this.color+(this.alpha*40)+')';
    ctx.fill();
    ctx.shadowBlur=0;
    // 内层亮线
    ctx.globalAlpha=this.alpha*1.8;
    ctx.strokeStyle=this.color+'0.7)';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.restore();
  }
}

// 火花粒子
class Spark{
  constructor(){this.reset()}
  reset(){
    this.x=Math.random()*W;this.y=Math.random()*H;
    this.r=Math.random()*1.5+0.3;
    this.alpha=Math.random()*0.3+0.1;
    this.pulse=Math.random()*Math.PI*2;
    this.vx=(Math.random()-0.5)*0.2;this.vy=(Math.random()-0.5)*0.2-0.3;
    const cols=['#a78bfa','#38bdf8','#34d399','#fbbf24','#f472b6','#818cf8','#5eead4'];
    this.color=cols[Math.floor(Math.random()*7)];
    this.life=Math.random()*200+100;
    this.age=0;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;this.age++;
    if(this.age>this.life||this.x<-20||this.x>W+20||this.y<-20||this.y>H+20)this.reset();
  }
  draw(ctx){
    const t=this.age/this.life;
    const a=this.alpha*(1-t)*(0.8+0.2*Math.sin(frame*0.05+this.pulse));
    ctx.save();ctx.globalAlpha=a;
    ctx.shadowColor=this.color;ctx.shadowBlur=8;
    ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

ribbons=Array.from({length:8},()=>new Ribbon());
sparks=Array.from({length:60},()=>new Spark());

function lp(){
  x.clearRect(0,0,W,H);
  // 深空渐变基底 (增强)
  const grad=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.8);
  grad.addColorStop(0,'rgba(40,25,60,0.4)');
  grad.addColorStop(0.5,'rgba(15,10,25,0.15)');
  grad.addColorStop(1,'rgba(6,5,10,0)');
  x.fillStyle=grad;x.fillRect(0,0,W,H);
  // 中心光晕
  const bloom=x.createRadialGradient(W/2+Math.sin(frame*0.003)*W*0.1,H/2+Math.cos(frame*0.004)*H*0.08,Math.min(W,H)*0.05,W/2,H/2,Math.min(W,H)*0.5);
  bloom.addColorStop(0,'rgba(120,100,180,0.06)');
  bloom.addColorStop(0.3,'rgba(80,140,200,0.03)');
  bloom.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=bloom;x.fillRect(0,0,W,H);

  ribbons.forEach(r=>{r.update();r.draw(x)});
  sparks.forEach(s=>{s.update();s.draw(x)});
  frame++;
  requestAnimationFrame(lp);
}
lp();
})();</script>
</body></html>

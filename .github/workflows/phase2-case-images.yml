name: Phase2 case image acquisition

on:
  push:
    paths:
      - ".github/workflows/phase2-case-images.yml"
      - "research/main/Phase2/3.paired_flip_analysis/scripts/fetch_case_images.py"

permissions:
  contents: write

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch twelve frozen CV-Bench images
        run: |
          python research/main/Phase2/3.paired_flip_analysis/scripts/fetch_case_images.py \
            --source-root research/main/Phase2/2.short_output_prompt_study \
            --work-root research/main/Phase2/3.paired_flip_analysis
      - name: Publish verified images on transfer branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/main/Phase2/3.paired_flip_analysis/raw/case_images
          git commit -m "Archive verified Phase2 case images"
          git push origin HEAD:refs/heads/phase2-case-images

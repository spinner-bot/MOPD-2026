<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 渲染器</title>
    <!-- 使用 marked.js 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js">
    </script>
    <!-- 使用 highlight.js 进行代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/cpp.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/c.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/typescript.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/go.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/rust.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js">
    </script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1c2129;
            --bg-hover: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --code-bg: #161b22;
            --inline-code-bg: #343941;
            --blockquote-border: #3b434b;
            --table-header-bg: #21262d;
            --table-row-alt: #161b22;
            --link-color: #58a6ff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas',
                'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ============ 顶部工具栏 ============ */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .toolbar .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            user-select: none;
        }
        .toolbar .logo svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .toolbar .file-info {
            flex: 1;
            min-width: 120px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: var(--font-sans);
            text-decoration: none;
            user-select: none;
        }
        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d1117;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-icon {
            padding: 8px 10px;
            font-size: 1.1rem;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ============ 主内容区 ============ */
        .main-container {
            margin-top: 60px;
            flex: 1;
            display: flex;
            min-height: calc(100vh - 60px);
        }

        /* ============ 侧边栏目录 ============ */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            overflow-y: auto;
            position: sticky;
            top: 60px;
            height: calc(100vh - 60px);
            transition: all var(--transition);
            display: none;
        }
        .sidebar.visible {
            display: block;
        }
        .sidebar h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul ul {
            padding-left: 16px;
            border-left: 1px solid var(--border-color);
            margin-left: 6px;
        }
        .sidebar li {
            margin: 2px 0;
        }
        .sidebar a {
            display: block;
            padding: 5px 10px;
            border-radius: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            transition: all var(--transition);
            border-left: 2px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-left-color: var(--accent);
        }
        .sidebar a.active {
            background: var(--bg-hover);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 500;
        }

        /* ============ 文档内容区 ============ */
        .content-area {
            flex: 1;
            padding: 32px 40px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100%;
            overflow-x: auto;
        }
        .content-area.empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            padding: 60px 20px;
        }
        .content-area.empty .icon {
            font-size: 4rem;
            opacity: 0.3;
            user-select: none;
        }
        .content-area.empty h2 {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.3rem;
        }
        .content-area.empty p {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 400px;
        }

        /* ============ Markdown 渲染样式 ============ */
        .markdown-body {
            font-size: 1rem;
            line-height: 1.7;
            word-wrap: break-word;
            color: var(--text-primary);
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            margin-top: 1.8em;
            margin-bottom: 0.6em;
            font-weight: 600;
            line-height: 1.3;
            color: var(--text-primary);
            scroll-margin-top: 80px;
            position: relative;
        }
        .markdown-body h1 {
            font-size: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4em;
        }
        .markdown-body h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3em;
        }
        .markdown-body h3 {
            font-size: 1.25rem;
        }
        .markdown-body h4 {
            font-size: 1.1rem;
        }
        .markdown-body h5,
        .markdown-body h6 {
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .markdown-body p {
            margin-bottom: 1em;
        }
        .markdown-body a {
            color: var(--link-color);
            text-decoration: none;
            transition: color var(--transition);
        }
        .markdown-body a:hover {
            text-decoration: underline;
            color: var(--accent-hover);
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            margin: 1em 0;
        }
        .markdown-body code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--inline-code-bg);
            padding: 0.2em 0.45em;
            border-radius: 4px;
            color: #e6edf3;
        }
        .markdown-body pre {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            overflow-x: auto;
            margin: 1.2em 0;
            position: relative;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #e6edf3;
            display: block;
            white-space: pre;
        }
        .markdown-body pre .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            font-size: 0.7rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            opacity: 0;
            transition: all var(--transition);
            font-family: var(--font-sans);
        }
        .markdown-body pre:hover .copy-btn {
            opacity: 1;
        }
        .markdown-body pre .copy-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .markdown-body blockquote {
            border-left: 4px solid var(--blockquote-border);
            padding: 8px 20px;
            margin: 1.2em 0;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }
        .markdown-body blockquote p {
            margin-bottom: 0.5em;
        }
        .markdown-body blockquote p:last-child {
            margin-bottom: 0;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.2em 0;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .markdown-body table th {
            background: var(--table-header-bg);
            color: var(--text-primary);
            font-weight: 600;
            padding: 10px 16px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
        }
        .markdown-body table td {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .markdown-body table tr:last-child td {
            border-bottom: none;
        }
        .markdown-body table tr:nth-child(even) td {
            background: var(--table-row-alt);
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2em 0;
        }
        .markdown-body ul,
        .markdown-body ol {
            margin: 0.8em 0;
            padding-left: 2em;
        }
        .markdown-body li {
            margin: 0.3em 0;
        }
        .markdown-body li > ul,
        .markdown-body li > ol {
            margin: 0.2em 0;
        }
        .markdown-body input[type='checkbox'] {
            margin-right: 8px;
            accent-color: var(--accent);
            transform: scale(1.1);
        }
        .markdown-body del {
            color: var(--text-muted);
        }
        .markdown-body mark {
            background: #3d2c00;
            color: #f0e6c8;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .markdown-body sup,
        .markdown-body sub {
            font-size: 0.75em;
        }
        .markdown-body .task-list-item {
            list-style: none;
            margin-left: -1.5em;
        }

        /* ============ 拖拽覆盖层 ============ */
        .drop-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            border: 3px dashed var(--accent);
            pointer-events: none;
        }
        .drop-overlay.active {
            display: flex;
        }
        .drop-overlay .inner {
            text-align: center;
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .drop-overlay .inner .icon {
            font-size: 4rem;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: 100%;
                height: auto;
                max-height: 200px;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .content-area {
                padding: 20px 16px;
                max-width: 100%;
            }
            .toolbar {
                padding: 10px 12px;
                gap: 8px;
            }
            .btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
            .markdown-body h1 {
                font-size: 1.6rem;
            }
            .markdown-body h2 {
                font-size: 1.3rem;
            }
        }
        @media (max-width: 480px) {
            .toolbar .file-info {
                display: none;
            }
            .toolbar .logo span {
                display: none;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
                <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
                <path d="M9 13h6"/>
                <path d="M9 17h6"/>
                <path d="M9 9h1"/>
            </svg>
            <span>MD 渲染器</span>
        </div>
        <div class="file-info" id="fileInfo">未加载文件</div>
        <div class="btn-group">
            <button class="btn" id="btnOpen" title="打开 .md 文件">
                📂 打开文件
            </button>
            <button class="btn" id="btnToggleToc" title="切换目录侧边栏">
                📑 目录
            </button>
            <button class="btn btn-primary" id="btnReload" title="重新渲染当前文件">
                🔄 重新渲染
            </button>
        </div>
        <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none;">
    </header>

    <!-- 拖拽覆盖层 -->
    <div class="drop-overlay" id="dropOverlay">
        <div class="inner">
            <div class="icon">📄</div>
            <div>松开以加载 Markdown 文件</div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 侧边栏目录 -->
        <aside class="sidebar" id="sidebar">
            <h3>📚 文档目录</h3>
            <ul id="tocList"></ul>
        </aside>

        <!-- 内容区域 -->
        <main class="content-area empty" id="contentArea">
            <div class="icon">📝</div>
            <h2>还没有加载文档</h2>
            <p>拖拽 .md 文件到页面任意位置，或点击「打开文件」按钮来渲染 Markdown 文档。</p>
            <button class="btn btn-primary" id="btnOpenEmpty">📂 选择文件</button>
        </main>
    </div>

    <script>
        (function() {
            // ==================== 配置 ====================
            const CDN_FALLBACK = true; // 如果 CDN 加载失败是否使用内置简易解析器

            // ==================== DOM 元素 ====================
            const fileInput = document.getElementById('fileInput');
            const btnOpen = document.getElementById('btnOpen');
            const btnOpenEmpty = document.getElementById('btnOpenEmpty');
            const btnToggleToc = document.getElementById('btnToggleToc');
            const btnReload = document.getElementById('btnReload');
            const dropOverlay = document.getElementById('dropOverlay');
            const contentArea = document.getElementById('contentArea');
            const sidebar = document.getElementById('sidebar');
            const tocList = document.getElementById('tocList');
            const fileInfo = document.getElementById('fileInfo');

            // ==================== 状态 ====================
            let currentMarkdown = '';
            let currentFileName = '';
            let currentFileContent = '';
            let tocVisible = false;
            let lastFile = null;

            // ==================== 检查 marked 是否加载 ====================
            function isMarkedAvailable() {
                return typeof marked !== 'undefined' && typeof marked.parse === 'function';
            }

            // ==================== 简易 Markdown 解析器（备用） ====================
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function simpleMarkdownToHtml(md) {
                // 非常基础的 Markdown 解析器（仅作为 CDN 失败时的紧急备用）
                let html = escapeHtml(md);

                // 代码块（需要先处理，避免被其他规则干扰）
                html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                    const escaped = escapeHtml(code);
                    return `<pre><code class="language-${escapeHtml(lang)}">${escaped}</code></pre>`;
                });

                // 行内代码
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                // 标题
                html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
                html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
                html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
                html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
                html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
                html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

                // 粗体和斜体
                html = html.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                html = html.replace(/___([^_]+)___/g, '<strong><em>$1</em></strong>');
                html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
                html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

                // 链接
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

                // 图片
                html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

                // 引用
                html = html.replace(/^&gt;\s?(.+)$/gm, '<blockquote>$1</blockquote>');

                // 无序列表
                html = html.replace(/^[-*+]\s+(.+)$/gm, '<li>$1</li>');
                html = html.replace(/(<li>[^<]*<\/li>)(?!<li>)/g, '<ul>$1</ul>');

                // 有序列表
                html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');

                // 水平线
                html = html.replace(/^(---|\*\*\*|___)\s*$/gm, '<hr>');

                // 段落
                html = html.replace(/\n{2,}/g, '\n\n');
                html = html.replace(/([^\n]+)\n/g, '<p>$1</p>\n');

                // 删除线
                html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');

                return html;
            }

            // ==================== 获取 Markdown 解析函数 ====================
            function parseMarkdown(md) {
                if (isMarkedAvailable()) {
                    try {
                        // 配置 marked
                        if (typeof marked.setOptions === 'function') {
                            marked.setOptions({
                                gfm: true,
                                breaks: true,
                                highlight: function(code, lang) {
                                    if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                                        try {
                                            return hljs.highlight(code, { language: lang, ignoreIllegals: true })
                                                .value;
                                        } catch (e) { /* ignore */ }
                                    }
                                    return code;
                                }
                            });
                        }
                        const html = marked.parse(md);
                        // 后处理：给代码块添加复制按钮
                        return addCopyButtonsToPre(html);
                    } catch (e) {
                        console.warn('marked.js 解析失败，使用简易解析器', e);
                        return simpleMarkdownToHtml(md);
                    }
                }
                console.warn('marked.js 未加载，使用简易解析器');
                return simpleMarkdownToHtml(md);
            }

            // 给代码块添加复制按钮
            function addCopyButtonsToPre(html) {
                // 使用 DOM 来处理，避免正则替换 HTML 的脆弱性
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const pres = tempDiv.querySelectorAll('pre');
                pres.forEach(function(pre) {
                    if (pre.querySelector('.copy-btn')) return;
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.textContent = '复制';
                    btn.addEventListener('click', function() {
                        const code = pre.querySelector('code');
                        if (code) {
                            navigator.clipboard.writeText(code.textContent).then(function() {
                                btn.textContent = '✓ 已复制';
                                setTimeout(function() { btn.textContent = '复制'; }, 1500);
                            }).catch(function() {
                                // 降级方案
                                const textarea = document.createElement('textarea');
                                textarea.value = code.textContent;
                                document.body.appendChild(textarea);
                                textarea.select();
                                document.execCommand('copy');
                                document.body.removeChild(textarea);
                                btn.textContent = '✓ 已复制';
                                setTimeout(function() { btn.textContent = '复制'; }, 1500);
                            });
                        }
                    });
                    pre.appendChild(btn);
                });
                return tempDiv.innerHTML;
            }

            // ==================== 渲染 ====================
            function renderMarkdown(md, fileName) {
                if (!md || md.trim() === '') {
                    showEmptyState('文件内容为空', '请选择一个包含 Markdown 内容的文件。');
                    return;
                }
                const html = parseMarkdown(md);
                contentArea.innerHTML = `<div class="markdown-body">${html}</div>`;
                contentArea.classList.remove('empty');
                // 高亮代码
                if (typeof hljs !== 'undefined' && typeof hljs.highlightAll === 'function') {
                    try {
                        hljs.highlightAll();
                    } catch (e) { /* ignore */ }
                }
                // 生成目录
                generateToc();
                // 更新文件信息
                fileInfo.textContent = fileName ? `📄 ${fileName}  ·  ${md.length} 字符` : '已渲染';
                fileInfo.title = fileName || '';
                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
                // 保存状态
                currentMarkdown = md;
                currentFileName = fileName || '';
            }

            function showEmptyState(title, desc) {
                contentArea.innerHTML = `
                    <div class="icon">📝</div>
                    <h2>${title}</h2>
                    <p>${desc}</p>
                    <button class="btn btn-primary" id="btnOpenEmpty2">📂 选择文件</button>
                `;
                contentArea.classList.add('empty');
                fileInfo.textContent = '未加载文件';
                tocList.innerHTML = '';
                sidebar.classList.remove('visible');
                // 重新绑定空状态按钮
                const btn = document.getElementById('btnOpenEmpty2');
                if (btn) btn.addEventListener('click', function() { fileInput.click(); });
            }

            // ==================== 生成目录 ====================
            function generateToc() {
                const headings = contentArea.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3');
                tocList.innerHTML = '';
                if (headings.length === 0) {
                    tocList.innerHTML = '<li style="color:var(--text-muted);font-size:0.8rem;padding:8px 10px;">暂无标题</li>';
                    return;
                }
                // 确保标题有 id
                headings.forEach(function(h, index) {
                    if (!h.id) {
                        h.id = 'heading-' + index;
                    }
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#' + h.id;
                    a.textContent = h.textContent;
                    // 根据层级缩进
                    const level = parseInt(h.tagName.substring(1), 10);
                    const indent = (level - 1) * 16;
                    a.style.paddingLeft = (10 + indent) + 'px';
                    a.style.fontSize = level === 1 ? '0.82rem' : level === 2 ? '0.78rem' : '0.72rem';
                    a.style.fontWeight = level === 1 ? '600' : '400';
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        // 高亮当前项
                        tocList.querySelectorAll('a').forEach(function(el) { el.classList.remove('active'); });
                        a.classList.add('active');
                    });
                    li.appendChild(a);
                    tocList.appendChild(li);
                });
                // 侧边栏滚动高亮
                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            const id = entry.target.id;
                            tocList.querySelectorAll('a').forEach(function(a) {
                                a.classList.toggle('active', a.getAttribute('href') === '#' +
                                    id);
                            });
                        }
                    });
                }, { rootMargin: '-60px 0px -60% 0px', threshold: 0 });
                headings.forEach(function(h) { observer.observe(h); });
            }

            // ==================== 文件读取 ====================
            function readFile(file) {
                if (!file) return;
                const ext = file.name.split('.').pop().toLowerCase();
                if (!['md', 'markdown', 'txt'].includes(ext)) {
                    alert('请选择 .md 或 .markdown 文件！');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    currentFileContent = content;
                    lastFile = file;
                    renderMarkdown(content, file.name);
                    // 自动显示目录
                    if (!tocVisible) {
                        toggleToc(true);
                    }
                };
                reader.onerror = function() {
                    alert('读取文件失败，请重试。');
                };
                reader.readAsText(file, 'UTF-8');
            }

            function handleFileSelect(e) {
                const file = e.target.files[0];
                if (file) readFile(file);
                fileInput.value = ''; // 允许重复选择同一文件
            }

            // ==================== 目录侧边栏切换 ====================
            function toggleToc(forceShow) {
                if (forceShow === true) {
                    tocVisible = true;
                    sidebar.classList.add('visible');
                } else if (forceShow === false) {
                    tocVisible = false;
                    sidebar.classList.remove('visible');
                } else {
                    tocVisible = !tocVisible;
                    sidebar.classList.toggle('visible', tocVisible);
                }
            }

            // ==================== 拖拽支持 ====================
            let dragCounter = 0;

            document.addEventListener('dragenter', function(e) {
                e.preventDefault();
                dragCounter++;
                dropOverlay.classList.add('active');
            });
            document.addEventListener('dragleave', function(e) {
                e.preventDefault();
                dragCounter--;
                if (dragCounter <= 0) {
                    dragCounter = 0;
                    dropOverlay.classList.remove('active');
                }
            });
            document.addEventListener('dragover', function(e) {
                e.preventDefault();
            });
            document.addEventListener('drop', function(e) {
                e.preventDefault();
                dragCounter = 0;
                dropOverlay.classList.remove('active');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    readFile(files[0]);
                }
            });

            // ==================== 键盘快捷键 ====================
            document.addEventListener('keydown', function(e) {
                // Ctrl/Cmd + O 打开文件
                if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                    e.preventDefault();
                    fileInput.click();
                }
                // Ctrl/Cmd + R 重新渲染
                if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
                    e.preventDefault();
                    if (currentMarkdown) {
                        renderMarkdown(currentMarkdown, currentFileName);
                    }
                }
                // Escape 关闭目录
                if (e.key === 'Escape' && tocVisible) {
                    toggleToc(false);
                }
            });

            // ==================== 事件绑定 ====================
            btnOpen.addEventListener('click', function() { fileInput.click(); });
            btnOpenEmpty.addEventListener('click', function() { fileInput.click(); });
            btnToggleToc.addEventListener('click', function() { toggleToc(); });
            btnReload.addEventListener('click', function() {
                if (currentMarkdown) {
                    renderMarkdown(currentMarkdown, currentFileName);
                } else if (lastFile) {
                    readFile(lastFile);
                } else {
                    showEmptyState('没有可渲染的内容', '请先打开一个 Markdown 文件。');
                }
            });
            fileInput.addEventListener('change', handleFileSelect);

            // ==================== 初始化 ====================
            console.log('%c📝 Markdown 渲染器已就绪', 'font-size:1.2rem;color:#58a6ff;font-weight:bold;');
            console.log('拖拽 .md 文件到页面任意位置即可渲染，或使用 Ctrl+O 打开文件。');
            console.log('支持的语法：Github Flavored Markdown（表格、任务列表、代码高亮等）。');

            // 检查 marked 是否可用
            if (!isMarkedAvailable()) {
                console.warn('⚠️ marked.js 未能从 CDN 加载，将使用内置简易解析器。');
                console.warn('建议联网使用以获得完整的 Markdown 渲染体验。');
            } else {
                console.log('✅ marked.js 已加载，完整 Markdown 语法支持可用。');
            }
        })();
    </script>
</body>
</html>

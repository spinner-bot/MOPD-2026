<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2a 盲审标注工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .progress {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            min-height: 600px;
        }

        .image-panel {
            flex: 1;
            padding: 20px;
            background: #fafafa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-container {
            max-width: 100%;
            max-height: 500px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 4px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 500px;
            display: block;
        }

        .image-info {
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .form-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 800px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group .hint {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-bar {
            padding: 10px 20px;
            background: #e8f5e9;
            border-top: 1px solid #c8e6c9;
            font-size: 13px;
            color: #2e7d32;
        }

        .status-bar.unsaved {
            background: #fff3e0;
            border-top-color: #ffe0b2;
            color: #e65100;
        }

        .required::after {
            content: " *";
            color: #e74c3c;
        }

        .validation-error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>B2a 盲审标注工具</h1>
            <div class="progress">
                进度：<span id="current-index">1</span> / <span id="total-count">32</span>
            </div>
        </div>

        <div class="main-content">
            <div class="image-panel">
                <div class="image-container">
                    <img id="current-image" src="" alt="待标注图片">
                </div>
                <div class="image-info">
                    <div>图片：<span id="image-name"></span></div>
                </div>
            </div>

            <div class="form-panel">
                <div class="form-group">
                    <label class="required">标注者姓名</label>
                    <input type="text" id="human_reviewer" placeholder="请输入您的姓名">
                </div>

                <div class="form-group">
                    <label class="required">图片是否可用</label>
                    <div class="radio-group">
                        <label><input type="radio" name="human_image_usable" value="true"> 是</label>
                        <label><input type="radio" name="human_image_usable" value="false"> 否</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="required">决定</label>
                    <div class="hint">candidate=找到合格目标，reject=无法提出，ambiguous=有潜力但不确定</div>
                    <select id="human_affordance_decision">
                        <option value="">请选择</option>
                        <option value="candidate">candidate（找到合格目标）</option>
                        <option value="reject">reject（无法提出合格目标）</option>
                        <option value="ambiguous">ambiguous（有潜力但不确定）</option>
                    </select>
                </div>

                <div class="form-group" id="question-group" style="display:none;">
                    <label class="required">目标问题</label>
                    <div class="hint">一个具体问题，让另一位审核者只看图片和问题就得到唯一答案</div>
                    <textarea id="human_target_question" placeholder="例如：图中左侧路线是否能到达出口？"></textarea>
                </div>

                <div class="form-group" id="answer-group" style="display:none;">
                    <label class="required">标准答案</label>
                    <textarea id="human_canonical_answer" placeholder="完整答案，可以是字符串或数组"></textarea>
                </div>

                <div class="form-group" id="family-group" style="display:none;">
                    <label class="required">任务类型</label>
                    <div class="hint">R=多个清楚可见证据的关系整合，PR=还需要感知困难的视觉证据</div>
                    <select id="human_affordance_family">
                        <option value="">请选择</option>
                        <option value="R">R（关系整合）</option>
                        <option value="PR">PR（关系整合+感知困难）</option>
                    </select>
                </div>

                <div class="form-group" id="evidence-group" style="display:none;">
                    <label class="required">直接视觉证据</label>
                    <div class="hint">每行一条，至少2条。必须是图片中可以直接指出的事实</div>
                    <textarea id="human_evidence_descriptions" placeholder="例如：&#10;左侧路线在中段被障碍物截断&#10;右侧路线连续连接到出口" rows="4"></textarea>
                </div>

                <div class="form-group" id="reasoning-group" style="display:none;">
                    <label class="required">推理步骤</label>
                    <div class="hint">每行一步，至少2步。必须把证据组合成新的中间结论</div>
                    <textarea id="human_reasoning_steps" placeholder="例如：&#10;分别检查两条路线的连续性，得到左路中断、右路连通&#10;将路线状态与可到达出口的条件结合，确定右路" rows="4"></textarea>
                </div>

                <div class="form-group" id="difficult-group" style="display:none;">
                    <label>困难视觉证据</label>
                    <div class="hint">PR类型必填，R类型留空。每行一条，必须是答案链中不可替代的视觉节点</div>
                    <textarea id="human_difficult_visual_evidence" placeholder="例如：&#10;出口标记很小，需要仔细辨认" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label class="required">是否需要外部知识</label>
                    <div class="hint">必须为"否"——答案只能依据图片得到</div>
                    <div class="radio-group">
                        <label><input type="radio" name="human_external_knowledge_needed" value="false" checked> 否</label>
                        <label><input type="radio" name="human_external_knowledge_needed" value="true"> 是（不合格）</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>备注</label>
                    <textarea id="human_notes" placeholder="可选。reject或ambiguous时必须说明原因" rows="3"></textarea>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="btn btn-secondary" id="prev-btn" onclick="previousImage()">上一张</button>
            <button class="btn btn-primary" id="save-btn" onclick="saveCurrent()">保存当前</button>
            <button class="btn btn-secondary" id="next-btn" onclick="nextImage()">下一张</button>
        </div>

        <div class="navigation" style="justify-content: center; gap: 20px;">
            <button class="btn btn-success" onclick="exportResults()">导出全部结果</button>
        </div>

        <div class="status-bar" id="status-bar">
            就绪
        </div>
    </div>

    <script>
        // 图片列表（32张）
        const imageList = [
            'img_0008699.jpg', 'img_0006379.jpg', 'img_0002594.jpg', 'img_0006602.jpg',
            'img_0003574.jpg', 'img_0007327.jpg', 'img_0009116.jpg', 'img_0002158.jpg',
            'img_0005869.jpg', 'img_0001866.jpg', 'img_0003068.jpg', 'img_0009114.jpg',
            'img_0004243.jpg', 'img_0003959.jpg', 'img_0004992.jpg', 'img_0009379.jpg',
            'img_0006182.jpg', 'img_0007005.jpg', 'img_0002200.jpg', 'img_0007289.jpg',
            'img_0006326.jpg', 'img_0005486.jpg', 'img_0008115.jpg', 'img_0005117.jpg',
            'img_0010535.jpg', 'img_0007217.jpg', 'img_0006560.jpg', 'img_0005161.jpg',
            'img_0005936.jpg', 'img_0008964.jpg', 'img_0001890.jpg', 'img_0006280.jpg'
        ];

        let currentIndex = 0;
        let annotations = {};
        let hasUnsavedChanges = false;

        // 初始化
        function init() {
            document.getElementById('total-count').textContent = imageList.length;
            loadImage(0);
            loadFromLocalStorage();
        }

        // 加载图片
        function loadImage(index) {
            currentIndex = index;
            const imgElement = document.getElementById('current-image');
            const imgName = imageList[index];

            imgElement.src = `images/${imgName}`;
            document.getElementById('image-name').textContent = imgName;
            document.getElementById('current-index').textContent = index + 1;

            // 加载该图片的标注数据
            loadAnnotation(index);

            // 更新按钮状态
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === imageList.length - 1;

            updateStatus('已加载图片 ' + (index + 1) + '/' + imageList.length);
        }

        // 加载标注数据
        function loadAnnotation(index) {
            const data = annotations[index] || {};

            document.getElementById('human_reviewer').value = data.human_reviewer || '';

            // 单选按钮
            const usableRadios = document.getElementsByName('human_image_usable');
            usableRadios.forEach(r => r.checked = r.value === String(data.human_image_usable || ''));

            document.getElementById('human_affordance_decision').value = data.human_affordance_decision || '';
            document.getElementById('human_target_question').value = data.human_target_question || '';
            document.getElementById('human_canonical_answer').value = data.human_canonical_answer || '';
            document.getElementById('human_affordance_family').value = data.human_affordance_family || '';
            document.getElementById('human_evidence_descriptions').value = data.human_evidence_descriptions || '';
            document.getElementById('human_reasoning_steps').value = data.human_reasoning_steps || '';
            document.getElementById('human_difficult_visual_evidence').value = data.human_difficult_visual_evidence || '';

            const knowledgeRadios = document.getElementsByName('human_external_knowledge_needed');
            knowledgeRadios.forEach(r => r.checked = r.value === String(data.human_external_knowledge_needed || 'false'));

            document.getElementById('human_notes').value = data.human_notes || '';

            // 根据决定显示/隐藏字段
            toggleFields();

            hasUnsavedChanges = false;
            updateStatus('已加载图片 ' + (index + 1) + ' 的标注数据');
        }

        // 保存当前标注
        function saveCurrent() {
            const data = {
                human_reviewer: document.getElementById('human_reviewer').value,
                human_image_usable: document.querySelector('input[name="human_image_usable"]:checked')?.value || '',
                human_affordance_decision: document.getElementById('human_affordance_decision').value,
                human_target_question: document.getElementById('human_target_question').value,
                human_canonical_answer: document.getElementById('human_canonical_answer').value,
                human_affordance_family: document.getElementById('human_affordance_family').value,
                human_evidence_descriptions: document.getElementById('human_evidence_descriptions').value,
                human_reasoning_steps: document.getElementById('human_reasoning_steps').value,
                human_difficult_visual_evidence: document.getElementById('human_difficult_visual_evidence').value,
                human_external_knowledge_needed: document.querySelector('input[name="human_external_knowledge_needed"]:checked')?.value || 'false',
                human_notes: document.getElementById('human_notes').value,
                image_name: imageList[currentIndex],
                saved_at: new Date().toISOString()
            };

            annotations[currentIndex] = data;
            saveToLocalStorage();

            hasUnsavedChanges = false;
            updateStatus('✓ 已保存图片 ' + (currentIndex + 1) + ' 的标注');
        }

        // 保存到 localStorage
        function saveToLocalStorage() {
            localStorage.setItem('b2a_annotations', JSON.stringify(annotations));
            localStorage.setItem('b2a_current_index', currentIndex);
        }

        // 从 localStorage 加载
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('b2a_annotations');
            if (saved) {
                annotations = JSON.parse(saved);
                const savedIndex = localStorage.getItem('b2a_current_index');
                if (savedIndex !== null) {
                    loadImage(parseInt(savedIndex));
                }
            }
        }

        // 上一张
        function previousImage() {
            if (currentIndex > 0) {
                if (hasUnsavedChanges && !confirm('当前图片未保存，是否继续？')) {
                    return;
                }
                loadImage(currentIndex - 1);
            }
        }

        // 下一张
        function nextImage() {
            if (currentIndex < imageList.length - 1) {
                if (hasUnsavedChanges && !confirm('当前图片未保存，是否继续？')) {
                    return;
                }
                loadImage(currentIndex + 1);
            }
        }

        // 根据决定显示/隐藏字段
        function toggleFields() {
            const decision = document.getElementById('human_affordance_decision').value;
            const family = document.getElementById('human_affordance_family').value;

            const showCandidateFields = decision === 'candidate';

            document.getElementById('question-group').style.display = showCandidateFields ? 'block' : 'none';
            document.getElementById('answer-group').style.display = showCandidateFields ? 'block' : 'none';
            document.getElementById('family-group').style.display = showCandidateFields ? 'block' : 'none';
            document.getElementById('evidence-group').style.display = showCandidateFields ? 'block' : 'none';
            document.getElementById('reasoning-group').style.display = showCandidateFields ? 'block' : 'none';
            document.getElementById('difficult-group').style.display = showCandidateFields && family === 'PR' ? 'block' : 'none';
        }

        // 监听字段变化
        document.addEventListener('input', function(e) {
            hasUnsavedChanges = true;
            updateStatus('未保存', true);
        });

        document.addEventListener('change', function(e) {
            if (e.target.name === 'human_image_usable' || e.target.name === 'human_external_knowledge_needed') {
                hasUnsavedChanges = true;
                updateStatus('未保存', true);
            }
            if (e.target.id === 'human_affordance_decision' || e.target.id === 'human_affordance_family') {
                toggleFields();
            }
        });

        // 更新状态栏
        function updateStatus(message, isUnsaved = false) {
            const statusBar = document.getElementById('status-bar');
            statusBar.textContent = message;
            statusBar.className = isUnsaved ? 'status-bar unsaved' : 'status-bar';
        }

        // 导出结果
        function exportResults() {
            // 验证
            const completedCount = Object.keys(annotations).length;
            if (completedCount < imageList.length) {
                if (!confirm(`只完成了 ${completedCount}/${imageList.length} 张图片，确定要导出吗？`)) {
                    return;
                }
            }

            // 生成JSON
            const results = [];
            for (let i = 0; i < imageList.length; i++) {
                const data = annotations[i];
                if (data) {
                    results.push({
                        image_index: i,
                        image_name: data.image_name,
                        human_reviewer: data.human_reviewer,
                        human_image_usable: data.human_image_usable === 'true',
                        human_affordance_decision: data.human_affordance_decision,
                        human_target_question: data.human_target_question,
                        human_canonical_answer: data.human_canonical_answer,
                        human_affordance_family: data.human_affordance_family,
                        human_evidence_descriptions: data.human_evidence_descriptions.split('\n').filter(s => s.trim()),
                        human_reasoning_steps: data.human_reasoning_steps.split('\n').filter(s => s.trim()),
                        human_difficult_visual_evidence: data.human_difficult_visual_evidence.split('\n').filter(s => s.trim()),
                        human_external_knowledge_needed: data.human_external_knowledge_needed === 'true',
                        human_notes: data.human_notes,
                        human_reviewed_at: data.saved_at,
                        human_verified: true
                    });
                }
            }

            // 下载
            const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `b2a_annotation_results_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
            a.click();
            URL.revokeObjectURL(url);

            updateStatus('✓ 已导出 ' + results.length + ' 条标注结果');
        }

        // 启动
        init();
    </script>
</body>
</html>
